name: CKO M08-M09 private corpus artifact integrity
on:
  push:
    branches: [feat/cko-m08-m09-corpus-atomic-20261114]
    paths:
      - 'governance/cko/canonical-atomic/2026-11-14/**'
      - '.github/workflows/cko-m08-m09-private-content.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive SHA, content IDs and no publication flags
        run: python3 governance/cko/canonical-atomic/2026-11-14/validate-atomic-content.py
