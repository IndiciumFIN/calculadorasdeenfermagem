name: P0 CKO COFEN-COR pilot offline adversarial tests
on:
  pull_request:
    paths:
      - "pilots/cko-cofen-cor/**"
      - ".github/workflows/cko-cofen-cor-p0-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-pilot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile code (no source fetching)
        run: python3 -m py_compile pilots/cko-cofen-cor/automatizacao/*.py pilots/cko-cofen-cor/tests/test_p0_security.py
      - name: Run 16 synthetic checks; no secrets or external data
        run: python3 -m unittest discover -s pilots/cko-cofen-cor/tests -p 'test_p0_security.py' -v
