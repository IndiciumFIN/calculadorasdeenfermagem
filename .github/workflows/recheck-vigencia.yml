# Re-verificação periódica de vigência (GAP-06).
# A publicação não encerra a responsabilidade sobre o conteúdo (decisão de
# 13/09/2026): átomos 'Vigente' com verificação antiga entram em alerta.
name: Recheck de Vigência

on:
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r packages/cli/requirements.txt

      - name: Recheck vigência (máx. 90 dias sem re-verificação)
        run: PYTHONPATH=. python -m packages.cli.recheck run --max-idade-dias 90
