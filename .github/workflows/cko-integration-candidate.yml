name: CKO - Candidate integration validation (technical HOLD)

on:
  push:
    branches:
      - integration/cko-parsers-catalog-20261114
  pull_request:
    branches:
      - integration/cko-p0-ci-g6-20261114

permissions:
  contents: read

jobs:
  combined-technical:
    name: Combined parser, catalog, Kernel tests (no clinical release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared CLI dependencies
        run: python -m pip install -r packages/cli/requirements.txt
      - name: Compile candidate sources and tests
        run: python -m compileall -q packages/cli scripts tests
      - name: FHIR positive, negative and policy tests
        run: python -m unittest discover -s tests -p 'test_fhir*py' -v
      - name: MedlinePlus XML rights and adversarial tests
        run: python -m unittest discover -s tests -p 'test_medlineplus*py' -v
      - name: MeSH XML and reference-integrity tests
        run: python -m unittest discover -s tests -p 'test_mesh*py' -v
      - name: CDC CVX official flat-file synthetic and adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_cvx_flat_file_parser.py' -v
          python -m unittest discover -s tests -p 'test_cvx_policy_failclosed.py' -v
      - name: WHO ICD-11 MMS JSON-LD synthetic and adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_icd11_mms_parser.py' -v
          python -m unittest discover -s tests -p 'test_icd11_policy_failclosed.py' -v
      - name: CATMAT item-catalog API synthetic and adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_catmat_parser.py' -v
          python -m unittest discover -s tests -p 'test_catmat_policy_failclosed.py' -v
      - name: Anvisa medicines CSV source-bound tests
        run: |
          python -m unittest discover -s tests -p 'test_anvisa_med_parser.py' -v
          python -m unittest discover -s tests -p 'test_anvisa_med_policy_failclosed.py' -v
      - name: SIES ZIP CSV official dictionary synthetic and adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_sies_parser.py' -v
          python -m unittest discover -s tests -p 'test_sies_policy_failclosed.py' -v
      - name: DATASUS CID-10 V2008 category CSV adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_cid10_category_parser.py' -v
          python -m unittest discover -s tests -p 'test_cid10_policy_failclosed.py' -v
      - name: ANVISA medical device registry CSV adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_anvisa_dev_parser.py' -v
          python -m unittest discover -s tests -p 'test_anvisa_dev_policy_failclosed.py' -v
      - name: PNI 2026 privacy aggregate and adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_pni_privacy_aggregate_parser.py' -v
          python -m unittest discover -s tests -p 'test_pni_policy_failclosed.py' -v
      - name: Canonical catalog deterministic and graph-invariant tests
        run: python -m unittest discover -s tests -p 'test_cko_catalog.py' -v
      - name: Kernel negative/release hold tests
        run: |
          python -m unittest discover -s tests -p 'test_kernel_registry_failclosed.py' -v
          python -m unittest discover -s tests -p 'test_kernel_release_holds.py' -v
          python -m unittest discover -s tests -p 'test_kernel_wo_g6_preflight.py' -v
      - name: Block direct approvals from all nine unverified validators
        run: python -m unittest discover -s tests -p 'test_cko_validator_direct_failclosed.py' -v
      - name: Verify G6 GitHub HEAD-bound independent review controls (synthetic negative tests)
        run: python -m unittest discover -s tests -p 'test_cko_g6_github_reviews.py' -v
      - name: Reused FHIR MedlinePlus and MeSH parser integration guards from PR 65
        run: python -m unittest discover -s tests -p 'test_cko_p0_parser_integration.py' -v
      - name: Isolated COFEN COR P0 crosswalk and adversarial pilot tests from PR 63
        run: python -m unittest discover -s pilots/cko-cofen-cor/tests -p 'test_p0_*.py' -v
      - name: Validate source-policy parity and reject orphan/duplicate validators
        run: python -m unittest discover -s tests -p 'test_repository_integrity.py' -v
      - name: Strict admission control negative tests
        run: python -m unittest discover -s tests -p 'test_cko_technical_admission.py' -v
      - name: AST source binding and no fake parser existence
        run: |
          python -m unittest discover -s tests -p 'test_cko_parser_contract_audit.py' -v
          python scripts/cko_parser_contract_audit.py --output "${{ runner.temp }}/cko-parser-ast.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cko-parser-ast.json").read_text())
          assert report["static_pass"], report["problems"]
          assert len(report["missing_parsers"]) == 5, report
          assert len(report["candidate_parsers_checked"]) == 11, report
          assert not report["publication_allowed"]
          print("AST_SOURCE_BINDINGS_PASS / PARSER_SUBSET=11 / MISSING=5 / NO_RELEASE")
          PY
      - name: Inspect canonical source-parser coverage without masking outstanding gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_repository_integrity import inspect
          result = inspect(Path("."))
          missing = [f for f in result["findings"] if f["code"] == "MISSING_PARSER"]
          assert result["counts"]["error"] == 0, result["findings"]
          assert result["counts"]["pending"] == len(missing), result["findings"]
          assert len(missing) == 5, result["findings"]
          assert all(x["path"] not in {
              "contracts/fontes/fhir_vitais.json",
              "contracts/fontes/medlineplus.json",
              "contracts/fontes/mesh.json",
              "contracts/fontes/vacinas_cdc.json",
              "contracts/fontes/cid11.json",
              "contracts/fontes/catmat.json",
              "contracts/fontes/anvisa_med.json",
              "contracts/fontes/sies.json",
              "contracts/fontes/cid10.json",
              "contracts/fontes/anvisa_dev.json",
              "contracts/fontes/pni.json"
          } for x in missing), missing
          assert result["strict_pass"] is False, result
          print("TECHNICAL_CANDIDATE_PASS, GLOBAL_STRICT_HOLD, REMAINING_PARSERS=5")
          PY
      - name: Produce and verify deterministic catalog (no promotion)
        run: |
          python scripts/cko_catalog.py --out-dir "${{ runner.temp }}/cko-catalog"
          python scripts/cko_catalog.py --check --out-dir "${{ runner.temp }}/cko-catalog"
          python - <<'PY'
          from pathlib import Path
          import json, os
          p = Path(os.environ["RUNNER_TEMP"]) / "cko-catalog" / "catalog.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["statistics"]["errors"] == 0, data["findings"]
          assert data["publication_allowed"] is False
          assert all(n.get("release_allowed") is False for n in data["entities"])
          ids = {n["id"] for n in data["entities"]}
          assert all(e["source"] in ids and e["target"] in ids for e in data["relationships"])
          print("GRAPH_METADATA_VALID / RELEASE_HOLD")
          PY
      - name: Archive derived graph as private evidence
        uses: actions/upload-artifact@v4
        with:
          name: cko-integration-catalog-${{ github.sha }}
          path: ${{ runner.temp }}/cko-catalog/
          retention-days: 30
          if-no-files-found: error

  strict-admission:
    name: Strict canonical admission (must block until all parsers exist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kernel dependencies for validator self-tests
        run: python -m pip install -r packages/cli/requirements.txt
      - name: Reject missing parsers, unsafe validator stubs and policy gaps — do not bypass
        run: python -m scripts.cko_technical_admission --output "${{ runner.temp }}/cko-strict-admission.json"
      - name: Preserve strict-admission HOLD evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cko-strict-admission-${{ github.sha }}
          path: ${{ runner.temp }}/cko-strict-admission.json
          retention-days: 30
          if-no-files-found: warn
