name: CE Migration-first Supabase provenance (NO SQL)
on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "docs/migration-crosswalk-supabase-ce-20261115.json"
      - "docs/audits/CE_SUPABASE_DIRECT_EXPORT_20261115/**"
      - "docs/audits/CE_SUPABASE_SECURITY_ADVISORS_20261115.json"
      - "scripts/verify_supabase_snapshot.py"
      - "tests/test_supabase_direct_inventory.py"
      - "scripts/check_supabase_migration_guard.py"
      - "tests/test_supabase_migration_guard.py"
      - "tests/test_cko_promotion_status_predicate.py"
      - ".github/workflows/ce-migration-provenance.yml"
  push:
    branches:
      - audit/ce-supabase-migration-first-20261115
permissions:
  contents: read
jobs:
  source-integrity-only:
    name: Offline tests / hold contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python source integrity tests without database
        run: python -m unittest discover -s tests -p 'test_supabase_migration_guard.py' -v
      - name: Characterize CKO promotion status predicate offline (not release authorization)
        run: python -m unittest discover -s tests -p "test_cko_promotion_status_predicate.py" -v
      - name: Verify directly extracted catalog integrity and counts
        run: python scripts/verify_supabase_snapshot.py
      - name: Negative and positive snapshot integrity tests
        run: python -m unittest discover -s tests -p "test_supabase_direct_inventory.py" -v
      - name: Assert real migration guard refuses execution and remains HOLD
        shell: bash
        run: |
          set +e
          python scripts/check_supabase_migration_guard.py --report
          code=$?
          set -e
          test "$code" -eq 2
