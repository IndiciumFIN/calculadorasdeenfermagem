name: CKO parser candidate tests (non-publishing)

on:
  push:
    branches:
      - review/cko-w7-public-evidence-20261114
    paths:
      - "packages/cli/parsers/**"
      - "tests/test_fhir_vitals_parser.py"
      - "tests/test_medlineplus_parser.py"
      - "tests/test_mesh_parser.py"
      - ".github/workflows/cko-parser-candidate-tests.yml"
  pull_request:
    paths:
      - "packages/cli/parsers/**"
      - "tests/test_fhir_vitals_parser.py"
      - "tests/test_medlineplus_parser.py"
      - "tests/test_mesh_parser.py"
      - ".github/workflows/cko-parser-candidate-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-parsers:
    name: Candidate parser tests (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install XML safety dependency
        run: python -m pip install "defusedxml>=0.7.1,<1"
      - name: Run FHIR R4 synthetic tests
        run: python -m unittest -v tests.test_fhir_vitals_parser
      - name: Run MedlinePlus XML synthetic tests
        run: python -m unittest -v tests.test_medlineplus_parser
      - name: Run MeSH XML synthetic tests
        run: python -m unittest -v tests.test_mesh_parser
