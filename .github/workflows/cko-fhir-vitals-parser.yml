name: CKO - FHIR R4 Vital Signs parser (technical HOLD)
on:
  push:
    branches: [feat/cko-parser-fhir-vitals-r4-20261114]
    paths:
      - 'packages/cli/parsers/**'
      - 'contracts/policies/KERNEL-POLICY-008.json'
      - 'tests/test_fhir*'
      - 'docs/cko/parsers/**'
      - '.github/workflows/cko-fhir-vitals-parser.yml'
  pull_request:
    branches: [fix/canonical-structural-cli-registry-20261114]
permissions:
  contents: read

jobs:
  fhir-synthetics:
    name: FHIR R4 parser and policy negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CLI requirements
        run: python -m pip install -r packages/cli/requirements.txt
      - name: Compile parser and policy tests
        run: python -m compileall -q packages/cli tests scripts
      - name: FHIR R4 synthetic positive and negative fixtures
        run: python -m unittest discover -s tests -p 'test_fhir*py' -v
      - name: Contract-specific parser exists, other missing dependencies stay HOLD
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_repository_integrity import inspect
          result = inspect(Path("."))
          missing = [f for f in result["findings"] if f["code"] == "MISSING_PARSER"]
          assert result["counts"]["error"] == 0, result["findings"]
          assert result["counts"]["pending"] == 15, result["findings"]
          assert len(missing) == 15, result["findings"]
          assert all(f["path"] != "contracts/fontes/fhir_vitais.json" for f in missing)
          assert result["strict_pass"] is False, "Global admission must remain HOLD"
          print("FHIR_PARSER_TEST_PASS / GLOBAL_STRICT_HOLD_15")
          PY
