# Gate Agregador — único check que deve ser marcado como obrigatório no
# branch protection da main (ver docs/GAP_REMEDIATION.md, ação manual).
# Substitui ci.yml e pipeline.yml, que mascaravam falhas com '|| echo' (GOV-002)
# e não executavam a validação real (GOV-003).
name: Gate Agregador

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r packages/cli/requirements.txt pytest pip-audit

      - name: Run aggregate gate (fail-closed)
        run: bash gates/aggregate.sh
