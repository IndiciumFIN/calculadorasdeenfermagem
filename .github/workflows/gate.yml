name: Gate Agregador

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/cli/requirements.txt || true
          pip install typer pydantic

      - name: Run aggregate gate
        run: |
          if [ -f gates/aggregate.sh ]; then
            bash gates/aggregate.sh
          else
            echo "gates/aggregate.sh não encontrado — gate mínimo"
            PYTHONPATH=. python -c "
from packages.cli.main import _validar_id_atomo
assert _validar_id_atomo('NORM-' + 'a'*12)
assert not _validar_id_atomo('BAD')
print('Validador de ID OK')
"
          fi

      - name: Fail closed
        if: failure()
        run: echo "GATE FAIL — merge bloqueado"
