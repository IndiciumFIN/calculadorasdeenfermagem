name: P0 CKO source-intake negative tests (no deploy)
on:
  pull_request:
    paths:
      - "scripts/cko_p0_intake_audit.py"
      - "tests/test_cko_p0_intake_audit.py"
      - ".github/workflows/cko-p0-intake-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Static Python + 7 negative scenarios
        run: |
          python3 -m py_compile scripts/cko_p0_intake_audit.py
          python3 tests/test_cko_p0_intake_audit.py -v
