name: CKO - MedlinePlus metadata XML (rights HOLD)
on:
  push:
    branches: [feat/cko-parser-medlineplus-xml-20261114]
    paths:
      - 'packages/cli/parsers/**'
      - 'packages/cli/requirements.txt'
      - 'contracts/policies/KERNEL-POLICY-015.json'
      - 'tests/test_medlineplus*'
      - 'docs/cko/parsers/**'
      - '.github/workflows/cko-medlineplus-parser.yml'
  pull_request:
    branches: [fix/canonical-structural-cli-registry-20261114]
permissions:
  contents: read

jobs:
  medlineplus-metadata:
    name: MedlinePlus XML parser / adversarial fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CLI requirements and safe XML parser
        run: python -m pip install -r packages/cli/requirements.txt
      - name: Compile parser, policy checks and tests
        run: python -m compileall -q packages/cli tests
      - name: XML metadata + rights + XXE + negative tests
        run: python -m unittest discover -s tests -p 'test_medlineplus*py' -v
      - name: Confirm remaining parsers remain blocked (no fake green)
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.verify_repository_integrity import inspect
          result = inspect(Path("."))
          missing = [f for f in result["findings"] if f["code"] == "MISSING_PARSER"]
          assert result["counts"]["error"] == 0, result["findings"]
          assert result["counts"]["pending"] == 15, result["findings"]
          assert len(missing) == 15, result["findings"]
          assert all(x["path"] != "contracts/fontes/medlineplus.json" for x in missing)
          assert result["strict_pass"] is False
          print("MEDLINEPLUS_METADATA_TECHNICAL_PASS / GLOBAL_STRICT_HOLD_15")
          PY
