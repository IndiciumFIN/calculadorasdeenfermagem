# Trusted base-branch policy. Never checkout or execute PR-head code here.
name: Branch quarantine - trusted PR ref gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  trusted-ref-gate:
    name: branch-quarantine / authorize-ref-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Enforce quarantine using policy from main, not from PR
        run: node scripts/verify-branch-quarantine.mjs --check-event
      - name: Unit tests for trusted policy
        run: node --test scripts/verify-branch-quarantine.test.mjs
