# Backup e retenção (GAP-10): snapshot semanal dos artefatos de governança
# como artifact do Actions (retenção de 90 dias). Complementa — não substitui —
# o versionamento Git; cobre o conteúdo gerado em data/ quando presente no runner.
name: Backup de Governança

on:
  schedule:
    - cron: '0 5 * * 1' # toda segunda-feira 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Empacotar artefatos de governança
        run: |
          tar -czf backup-governanca.tar.gz \
            contracts/ agents/ prompts/ packages/schemas/ gates/ docs/ supabase/ data/
          sha256sum backup-governanca.tar.gz > backup-governanca.sha256

      - name: Upload snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-governanca-${{ github.run_id }}
          path: |
            backup-governanca.tar.gz
            backup-governanca.sha256
          retention-days: 90
