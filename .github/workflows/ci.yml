name: CI - Validacao Estrita (sem bypass)

on:
  push:
    branches:
      - main
      - fix/cko-ci-no-masked-checks-20261114
  pull_request:
    branches:
      - main
      - fix/canonical-structural-cli-registry-20261114

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript must fail on compilation errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify TypeScript without fallback
        run: npm run type-check

  cli:
    name: Python CLI and clinical HOLD checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CLI dependencies with declared versions
        run: python -m pip install -r packages/cli/requirements.txt
      - name: Compile Python packages, scripts and tests
        run: python -m compileall -q packages/cli packages/schemas scripts tests
      - name: Verify CLI invocation without catch-all
        run: python -m packages.cli.main --help
      - name: Verify kernel policy CLI without catch-all
        run: python -m packages.cli.main kernel list-policies
      - name: Verify negative and pending-HOLD regressions
        run: python -m unittest discover -s tests -p 'test_kernel_*.py' -v
