name: P0 three reused source parsers (13 remaining HOLD)
on:
  pull_request:
    branches:
      - fix/canonical-structural-cli-registry-20261114
    paths:
      - "packages/cli/parsers/**"
      - "packages/cli/requirements.txt"
      - "contracts/policies/KERNEL-POLICY-005.json"
      - "contracts/policies/KERNEL-POLICY-008.json"
      - "contracts/policies/KERNEL-POLICY-015.json"
      - "tests/test_cko_p0_parser_integration.py"
      - ".github/workflows/cko-p0-existing-parser-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-integrated-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r packages/cli/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_fhir*py' -v
      - run: python -m unittest discover -s tests -p 'test_medlineplus*py' -v
      - run: python -m unittest discover -s tests -p 'test_mesh*py' -v
      - run: python -m unittest discover -s tests -p 'test_cko_p0_parser_integration.py' -v
